name: Mirror signed RentnerProxy packages

on:
    push:
        branches: [main]
    workflow_dispatch:
    schedule:
        - cron: '7,37 * * * *'

permissions: {}

concurrency:
    group: legacy-rentnerproxy-pages
    cancel-in-progress: false

jobs:
    build:
        if: github.repository == 'RentnerProxy/RentnerProxy.github.io' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        outputs:
            source_sha: ${{ steps.snapshot.outputs.source_sha }}
        steps:
            - name: Read mirror verifier source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: mirror
                  persist-credentials: false
            - name: Build the package mirror verifier
              shell: bash
              run: |
                  set -Eeuo pipefail
                  rustup toolchain install 1.99.1 --profile minimal
                  cargo +1.99.1 build --locked --release \
                      --manifest-path mirror/.github/package-mirror-verifier/Cargo.toml \
                      --target-dir "$RUNNER_TEMP/package-mirror-verifier"
            - name: Read public package data without executing source code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: RentnerProxy/platform
                  ref: package-repository
                  path: source
                  persist-credentials: false
                  sparse-checkout: public
            - name: Verify signed snapshot with the existing pinned owner key
              id: snapshot
              shell: bash
              env:
                  FINGERPRINT: 517046BFFA2C01095A641E07F8E716383322D7C3
              run: |
                  set -Eeuo pipefail
                  verifier="$RUNNER_TEMP/package-mirror-verifier/release/package-mirror-verifier"
                  "$verifier" admit
                  export GNUPGHOME
                  GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/mirror-gpg-XXXXXXXX")
                  chmod 0700 "$GNUPGHOME"
                  trap 'rm -rf -- "$GNUPGHOME"' EXIT
                  key="source/public/keys/$FINGERPRINT.asc"
                  [[ $(wc -c < "$key") -le 131072 ]]
                  ! grep -q 'PRIVATE KEY' "$key"
                  actual=$(gpg --batch --with-colons --import-options show-only --import "$key" | awk -F: '$1 == "fpr" {print $10; exit}')
                  [[ "$actual" == "$FINGERPRINT" ]]
                  gpg --batch --import "$key"
                  gpg --batch --export "$FINGERPRINT" > "$GNUPGHOME/pinned.gpg"
                  for metadata in catalog.json immutable-files.json; do
                      gpgv --keyring "$GNUPGHOME/pinned.gpg" "source/public/$metadata.asc" "source/public/$metadata"
                  done
                  "$verifier" verify-immutable
                  for channel in alpha beta stable; do
                      gpgv --keyring "$GNUPGHOME/pinned.gpg" "source/public/apt/dists/$channel/InRelease"
                      for architecture in x86_64 aarch64; do
                          metadata="source/public/rpm/$channel/$architecture/repodata/repomd.xml"
                          gpgv --keyring "$GNUPGHOME/pinned.gpg" "$metadata.asc" "$metadata"
                      done
                  done
                  mkdir -p "$RUNNER_TEMP/legacy-pages"
                  cp -a source/public "$RUNNER_TEMP/legacy-pages/RentnerProxy"
                  source_sha=$(git -C source rev-parse --verify HEAD)
                  [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
                  printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
            - name: Upload exact verified bytes under the legacy project path
              uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
              with:
                  path: ${{ runner.temp }}/legacy-pages

    deploy:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy legacy package repository mirror
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

    record:
        name: Record successfully deployed upstream revision
        needs: [build, deploy]
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            - name: Update owned source marker only when the upstream revision changes
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
              run: |
                  set -Eeuo pipefail
                  [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
                  endpoint="repos/$GITHUB_REPOSITORY/contents/.rentnerproxy-upstream"
                  response=$(mktemp "$RUNNER_TEMP/mirror-marker-XXXXXXXX")
                  request=$(mktemp "$RUNNER_TEMP/mirror-marker-request-XXXXXXXX")
                  trap 'rm -f -- "$response" "$request"' EXIT
                  status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
                      --header "Authorization: Bearer $GH_TOKEN" \
                      --header 'Accept: application/vnd.github+json' \
                      --header 'X-GitHub-Api-Version: 2022-11-28' \
                      "$GITHUB_API_URL/$endpoint?ref=main")
                  previous_sha=''
                  case "$status" in
                      200)
                          jq --exit-status '.type == "file" and .encoding == "base64" and .size == 41 and (.sha | test("^[a-f0-9]{40}$"))' "$response" > /dev/null
                          previous_sha=$(jq --raw-output '.sha' "$response")
                          previous_source=$(jq --raw-output '.content' "$response" | base64 --decode)
                          [[ "$previous_source" =~ ^[a-f0-9]{40}$ ]]
                          if [[ "$previous_source" == "$SOURCE_SHA" ]]; then
                              echo 'The deployed upstream revision is already recorded.'
                              exit 0
                          fi
                          ;;
                      404) ;;
                      *) echo '::error::Cannot read the owned upstream revision marker.'; exit 1 ;;
                  esac
                  content=$(printf '%s\n' "$SOURCE_SHA" | base64 --wrap=0)
                  jq --null-input --arg content "$content" --arg sha "$previous_sha" \
                      '{message: "chore: record deployed RentnerProxy package revision", branch: "main", content: $content} + (if $sha == "" then {} else {sha: $sha} end)' > "$request"
                  gh api --method PUT "$endpoint" --input "$request" > /dev/null
